name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", tox: py310}
          - {python: "3.11", tox: py311}
          - {python: "3.12", tox: py312}
          - {python: "3.13", tox: py313}
          - {python: "3.14", tox: py314}
          - {python: "3.15", tox: py315}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: python -m pip install 'tox>=4'
      - name: Test installed wheel
        run: python -m tox -e ${{ matrix.tox }}
      - name: Upload HTML coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.tox }}
          path: .tox/${{ matrix.tox }}/htmlcov
          include-hidden-files: true

  distributions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

  optimizers:
    runs-on: ubuntu-22.04
    env:
      IMAGEHELPER_REQUIRE_OPTIMIZERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install image optimizers
        run: |
          sudo apt-get update
          sudo apt-get install -y advancecomp gifsicle libjpeg-turbo-progs jpegoptim optipng pngcrush
      - name: Test installed optimizers
        run: |
          python -m pip install '.[testing]'
          python -m pytest -q tests/test_optimizers.py tests/test_animated_gif.py
