[metadata]
name = imagehelper
version = attr: imagehelper.__VERSION__
url = https://github.com/jvanasco/imagehelper
author = Jonathan Vanasco
author_email = jonathan@findmeon.com
description = Utilities for image resizing and uploading.
long_description = file: README.md
long_description_content_type = text/markdown
license = BSD
license_files = LICENSE.txt
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
    Intended Audience :: Developers
    Topic :: Multimedia :: Graphics :: Graphics Conversion
    Topic :: Software Development :: Libraries :: Python Modules

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
include_package_data = True
zip_safe = False
install_requires =
    envoy
    Pillow
    typing_extensions
    legacy-cgi; python_version >= "3.13"

[options.packages.find]
where = src

[options.package_data]
imagehelper = py.typed

[options.extras_require]
testing =
    boto3
    mypy-boto3-s3
    pytest
    requests
    types-Pillow
    types-requests

[tox:tox]
requires = tox>=4
env_list = py310, py311, py312, py313, py314, py315

[testenv]
package = wheel
extras = testing
deps = coverage
pass_env =
    TEST_S3
    AWS_KEY_PUBLIC
    AWS_KEY_SECRET
    AWS_BUCKET_PUBLIC
    AWS_BUCKET_ARCHIVE
    AWS_BUCKET_ALT
set_env =
    COVERAGE_FILE = {env_dir}/.coverage
commands =
    python -m coverage erase
    python -m coverage run -m pytest {posargs}
    python -m coverage report
    python -m coverage html -d {env_dir}/htmlcov

[flake8]
max-line-length = 88
ignore = E501, W503
import_order_style = appnexus
application_import_names = imagehelper
per-file-ignores =
    src/imagehelper/__init__.py: F401
    src/imagehelper/saver/__init__.py: F401
